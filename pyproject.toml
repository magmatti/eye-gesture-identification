[project]
name = "eye-gesture-identification"
version = "0.1.0"
description = "Threshold-based eye gesture identification from Meta Quest Pro recordings."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
]

[dependency-groups]
dev = [
    "ipykernel",
    "jupyterlab>=4.1",
]
